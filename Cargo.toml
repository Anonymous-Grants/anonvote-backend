[package]
name = "anonvote-backend"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Orchestration backend for AnonVote: round/proposal metadata, voter-registration and vote relaying, live tally, and Drips-style payout execution on Stellar Soroban."
publish = false

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "signal"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tower = "0.5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

thiserror = "2"
anyhow = "1"
dotenvy = "0.15"

hex = "0.4"
regex = "1"
once_cell = "1"
tempfile = "3"

# Reuses the exact same Poseidon2-over-BN254 construction the AnonVote
# contract and Noir circuit use, so proof_service's off-chain hashing
# (nullifier/leaf computation for server-side proving) matches on-chain
# hashing bit-for-bit. See src/proof_service.rs.
soroban-sdk = "27.0.0"
soroban-poseidon = "27.0.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
